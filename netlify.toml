# ---------------------------------------------------------------------------
# Caching: hashed JS/CSS bundles never change; images change rarely.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/common/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/home_preview/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/home1/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/innerpages/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
