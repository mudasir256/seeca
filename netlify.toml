[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Node 22 is required by the pre-render step (puppeteer-core / @sparticuz/chromium).
  NODE_VERSION = "22"
  # Netlify sets CI=true, which makes Create React App fail on lint warnings.
  CI = "false"
  # The pre-render step uses its own bundled Chromium; skip Puppeteer's download.
  PUPPETEER_SKIP_DOWNLOAD = "1"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "1"

# ---------------------------------------------------------------------------
# Every public page is pre-rendered to its own HTML file at build time
# (scripts/prerender.js), so there is no catch-all "/* -> /index.html" rule.
# Unknown URLs get build/404.html with a real 404 status.
# ---------------------------------------------------------------------------

# Project pages: those with their own description are pre-rendered; the rest
# (not indexed yet) are served by the app shell, which renders them in the browser.
[[redirects]]
  from = "/portfolio/*"
  to = "/app-shell.html"
  status = 200

# Old URLs from the previous website and template routes -> current pages.
[[redirects]]
  from = "/innerpages/*"
  to = "/:splat"
  status = 301

